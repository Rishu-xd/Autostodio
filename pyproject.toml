[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autostudio"
version = "0.1.0"
description = "Multi-agent AI video production studio powered by Gemini and Manim"
readme = "README.md"
authors = [{ name = "AutoStudio Team" }]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.3.0",
    "pydantic>=2.10.0",
    "manim>=0.18.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[project.scripts]
autostudio = "cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
